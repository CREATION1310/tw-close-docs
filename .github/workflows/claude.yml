# @claude on GitHub — anthropics/claude-code-action.
# Mention @claude in an issue or PR comment (or an issue title/body) and Claude
# answers, reviews, and can push fixes.
#
# Authenticated with a Claude subscription via CLAUDE_CODE_OAUTH_TOKEN
# (generated locally with `claude setup-token`) rather than a metered API key.
# Armed by three one-time owner steps (all done):
#   1. Repo secret CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and variables → Actions).
#   2. Repo variable ENABLE_CLAUDE_MENTION = true (same page, Variables tab) — the switch.
#   3. Optional: install the Claude GitHub App (https://github.com/apps/claude) for a
#      proper bot identity; without it the action falls back to the workflow token.
# The `if` below keeps the job from running unless the variable is true, so it stays
# inert if the switch is ever turned off.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when the switch is on AND @claude is actually mentioned.
    if: |
      vars.ENABLE_CLAUDE_MENTION == 'true' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
